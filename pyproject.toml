[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fenqixuangu"
version = "0.5.1"
description = "Research-only A-share divergence and support selection pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<4.0",
  "numpy>=1.26,<3.0",
  "requests>=2.32,<3.0",
  "curl_cffi>=0.11,<1.0",
  "akshare>=1.16,<2.0",
  "openpyxl>=3.1,<4.0",
  "baostock>=0.9.3,<0.10",
]

[tool.setuptools]
packages = ["src"]
